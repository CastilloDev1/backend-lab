services:
  # La "fuente de la Verdad" (Consistencia ACID)
  postgres:
    image: postgres:18-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: lab_db
    ports:
      - "5432:5432"
  
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: lab-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lab.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "80:80"
    depends_on:
      - postgres

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: lab-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123

  opensearch:
    image: opensearchproject/opensearch:2.11.0 # Puedes ajustar a la versión que necesites
    container_name: lab-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - node.store.allow_mmap=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 9200:9200
      - 9600:9600 # Puerto para métricas de performance

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: lab-opensearch-dashboards
    ports:
      - 5602:5601
    environment:
      - OPENSEARCH_HOSTS=["http://lab-opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch